name: Keep Render service awake

on:
  schedule:
    # Every 5 minutes. Render's free tier spins the service down after 15
    # minutes with no inbound HTTP traffic (which would also kill the
    # bot's long-polling loop running alongside the API) -- this keeps it
    # warm. 5 min leaves margin for GitHub's own scheduling jitter.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: curl -fsS --max-time 20 https://quizuzup-bot.onrender.com/healthz
